<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Create Ticket</h1>
            <p class="subtitle">MoBilis Ticket Management System</p>
        </div>

        <form id="ticketForm" class="ticket-form">
            <!-- Project Info -->
            <fieldset class="form-section">
                <legend>Project Information</legend>
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" name="project_name" placeholder="e.g., MoBilis" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="projectUrl">Project URL</label>
                        <input type="url" id="projectUrl" name="project_url" placeholder="https://mobilis.brigada.net" required>
                    </div>
                    <div class="form-group">
                        <label for="apiUrl">API URL</label>
                        <input type="url" id="apiUrl" name="api_url" placeholder="https://api.mobilis.brigada.net" required>
                    </div>
                </div>
            </fieldset>

            <!-- Ticket Basic Info -->
            <fieldset class="form-section">
                <legend>Ticket Information</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ticketNo">Ticket No</label>
                        <input type="text" id="ticketNo" name="ticket_no" placeholder="TKT-2026-0001" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type" name="type" required>
                            <option value="">Select Type</option>
                            <option value="bug">Bug</option>
                            <option value="feature">Feature</option>
                            <option value="enhancement">Enhancement</option>
                            <option value="documentation">Documentation</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <input type="text" id="platform" name="platform" placeholder="MoBilis" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="">Select Status</option>
                            <option value="open">Open</option>
                            <option value="in_progress">In Progress</option>
                            <option value="resolved">Resolved</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="module">Module</label>
                        <input type="text" id="module" name="module" placeholder="Documents" required>
                    </div>
                    <div class="form-group">
                        <label for="submodule">Submodule</label>
                        <input type="text" id="submodule" name="submodule" placeholder="documents routing" required>
                    </div>
                </div>
            </fieldset>

            <!-- Description Section -->
            <fieldset class="form-section">
                <legend>Description</legend>
                <div class="form-group">
                    <label for="currentState">Current State</label>
                    <textarea id="currentState" name="current_state" rows="3" placeholder="Describe the current state..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="desiredState">Desired State</label>
                    <textarea id="desiredState" name="desired_state" rows="3" placeholder="Describe the desired state..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="purpose">Purpose</label>
                    <textarea id="purpose" name="purpose" rows="3" placeholder="Explain the purpose..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" name="remarks" rows="3" placeholder="Additional remarks (optional)"></textarea>
                </div>
            </fieldset>

            <!-- Reporter & Dates -->
            <fieldset class="form-section">
                <legend>Reporter Information</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="reporterName">Reporter Name</label>
                        <input type="text" id="reporterName" name="reporter_name" placeholder="Super Admin" required>
                    </div>
                    <div class="form-group">
                        <label for="reporterRole">Reporter Role</label>
                        <input type="text" id="reporterRole" name="reporter_role" placeholder="admin" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="dateDetected">Date Detected</label>
                        <input type="date" id="dateDetected" name="date_detected" required>
                    </div>
                    <div class="form-group">
                        <label for="pageUrl">Page URL</label>
                        <input type="url" id="pageUrl" name="page_url" placeholder="https://mobilis.brigada.net/app/documents" required>
                    </div>
                </div>
            </fieldset>

            <!-- Evidence Section -->
            <fieldset class="form-section">
                <legend>Evidence</legend>
                <div id="evidenceContainer"></div>
                <button type="button" class="btn-secondary" id="addEvidenceBtn">+ Add Evidence</button>
            </fieldset>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">Create Ticket</button>
                <button type="reset" class="btn-secondary">Clear Form</button>
            </div>
        </form>

        <!-- Response Message -->
        <div id="responseMessage" class="response-message hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
